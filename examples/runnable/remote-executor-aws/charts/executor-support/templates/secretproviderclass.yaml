apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: datahub-executor-secrets
spec:
  provider: aws
  parameters:
    # The CSI provider assumes the role associated with the worker pod's
    # service account through EKS Pod Identity (no IRSA annotation needed).
    usePodIdentity: "true"
    # The secret is one JSON document holding both halves of the access key.
    # jmesPath splits it into two files; objectAlias sets each filename under
    # /mnt/secrets. Recipe secret references are case-sensitive and must match
    # the aliases exactly. The whole document is also mounted, under the
    # top-level alias.
    objects: |
      - objectName: {{ .Values.secretArn | quote }}
        objectType: "secretsmanager"
        objectAlias: "s3-ingest-credentials.json"
        jmesPath:
          - path: "access_key_id"
            objectAlias: {{ .Values.accessKeyIdAlias | quote }}
          - path: "secret_access_key"
            objectAlias: {{ .Values.secretAccessKeyAlias | quote }}
