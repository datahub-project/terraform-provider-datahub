name: Nightly Live

# Triggers:
#   - Every push to main (catches regressions immediately after merge).
#   - Daily at 14:00 UTC (off-peak for hosted runners).
#   - PRs targeting main when the run-live-ci label is present; re-triggers on
#     label add, new commits, and re-open so the result stays current.
#
# There is deliberately no release trigger. GitHub does not start workflows
# from events raised with GITHUB_TOKEN, and GoReleaser publishes with it, so a
# release: published trigger here never fired once between v0.17.0 and v0.23.0
# -- while the comment that used to sit in this spot claimed it did. The
# release workflow now dispatches the smoke test directly instead.
#
# Uses the live-acceptance reusable workflow (same logic as the release gate).
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * *"
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [main]

permissions: read-all

concurrency:
  group: nightly-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-acceptance:
    name: Live Acceptance
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-live-ci'))
    uses: ./.github/workflows/live-acceptance.yml

  # Stage C: applies and destroys the runnable examples for real, proving the
  # configuration a user copies works as published. Its own Quickstart, so its
  # destroy-leaves-nothing assertion is not confused by the acceptance suite's
  # own entities.
  #
  # No `push` trigger, unlike live-acceptance above. live-acceptance already
  # boots a Quickstart on every merge, and booting a second doubles the cost of
  # every merge to catch a narrower class of regression a few hours earlier.
  # Promote it to push if the measured wall-clock turns out to be small.
  live-examples:
    name: Live Examples
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-live-ci'))
    uses: ./.github/workflows/live-examples.yml

  # Proves a published release is usable, against the artifact the Registry
  # actually serves rather than a locally built binary. Extracted to its own
  # reusable workflow so release.yml can dispatch just this, without dragging
  # in the live suites above.
  registry-smoke-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/registry-smoke-test.yml
