name: Live Acceptance

# Reusable workflow called by release.yml (on every v* tag) and nightly-live.yml
# (on schedule, manual dispatch, and run-live-ci labeled PRs). Boots a DataHub
# Quickstart, runs the live acceptance tests, and always tears down on exit.
on:
  workflow_call:

permissions: read-all

jobs:
  live-acceptance:
    name: Live Acceptance (Quickstart)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go module cache: caches ~/.cache/go/mod keyed on go.sum so `go test`
      # does not re-download modules on every run.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dev deps (datahub CLI)
        run: make dev-deps

      # Booting is its own step so its cost is attributable. Previously this ran
      # inside the test step via `make testacc-quickstart`, which made the whole
      # thing one opaque block -- roughly eight minutes with nothing to say how
      # much was image pulls and how much was tests, so a real slowdown could
      # only be found by comparing durations across runs.
      - name: Boot Quickstart
        run: make quickstart-up

      - name: Run Quickstart-backed acceptance tests
        # TF_ACC_LOG captures the provider's own tflog stream, which the
        # container logs below do not contain. Without it a settle-barrier
        # timeout (structured_properties.go, CAT-2583) is invisible in CI and a
        # husk failure cannot be told apart from a barrier that gave up.
        #
        # Pinned at WARN deliberately -- do NOT raise this to DEBUG or TRACE.
        # tflog writes exactly the map it is handed and is not governed by the
        # schema's Sensitive/WriteOnly markers, which cover state and plan
        # rendering only. That channel logged a user's password, an invite
        # token and an Authorization bearer from v0.4.0 until v0.19.1. These
        # logs upload as an artifact readable by anyone with repo read access,
        # so the level is a security boundary, not a verbosity preference.
        env:
          TF_ACC_LOG: WARN
          TF_ACC_LOG_PATH: ${{ github.workspace }}/provider-logs/acceptance.log
        # testacc-local rather than testacc-quickstart: the latter boots the
        # instance itself and installs a shell EXIT trap that nukes it when this
        # step ends. That trap is why the failure diagnostics below have never
        # captured anything -- the containers were already gone by the time the
        # capture step ran, which is visible in the 182-byte quickstart-logs
        # artifact from the 2026-08-03 nightly: a ps.txt holding only its header.
        # Teardown is now an explicit step, ordered after the capture.
        run: |
          mkdir -p provider-logs
          make testacc-local

      - name: Upload provider logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: provider-logs
          path: provider-logs/
          if-no-files-found: ignore

      - name: Capture Quickstart logs on failure
        if: failure()
        run: |
          mkdir -p quickstart-logs
          docker ps -a > quickstart-logs/ps.txt 2>&1 || true
          for c in $(docker ps -aq 2>/dev/null); do
            docker logs "$c" > "quickstart-logs/${c}.log" 2>&1 || true
          done
      - name: Upload Quickstart logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quickstart-logs
          path: quickstart-logs/
          if-no-files-found: ignore

      # Last, and always: after the diagnostics above have read the containers,
      # never before. `if: always()` also covers cancellation, which a shell EXIT
      # trap inside a single step does not reliably survive.
      #
      # On a GitHub-hosted runner this is close to ceremony -- the VM is
      # discarded either way -- but it keeps the workflow correct if it is ever
      # run on a self-hosted runner, and it makes the teardown visible as its own
      # timed step rather than folded invisibly into the tests.
      - name: Tear down Quickstart
        if: always()
        run: make quickstart-down || true
