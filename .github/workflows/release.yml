name: Release

# Triggered by pushing a tag matching v* (e.g. v0.1.0).
# The goreleaser job is gated behind the "release" GitHub Environment so a
# designated approver must confirm before binaries are built and published.
on:
  push:
    tags:
      - v*

concurrency:
  group: release
  cancel-in-progress: false

permissions: read-all

jobs:
  live-acceptance:
    name: Live Acceptance
    uses: ./.github/workflows/live-acceptance.yml

  goreleaser:
    name: GoReleaser
    needs: live-acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # actions: write is what lets the final step dispatch the smoke test.
      # Dispatching is permitted with GITHUB_TOKEN; it is only the release
      # event that GitHub suppresses, which is why the smoke test cannot
      # simply trigger itself.
      actions: write
    environment:
      name: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs the full tag history to generate a correct changelog
          # and to determine the previous tag for release notes.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Check for existing release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --json id >/dev/null 2>&1; then
            echo "ERROR: GitHub release ${GITHUB_REF_NAME} already exists." >&2
            echo "Delete the release and re-push the tag to retry:" >&2
            echo "  gh release delete ${GITHUB_REF_NAME} --yes" >&2
            echo "  git tag -d ${GITHUB_REF_NAME}" >&2
            echo "  git push origin --delete ${GITHUB_REF_NAME}" >&2
            echo "  git tag -a ${GITHUB_REF_NAME} -m \"Release ${GITHUB_REF_NAME}\"" >&2
            echo "  git push origin ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Extract release notes
        run: bash scripts/extract-release-notes.sh "${GITHUB_REF_NAME#v}"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        with:
          args: release --clean
      - name: Set release body
        # GoReleaser's --release-notes flag does not reliably apply the body
        # through its draft->publish two-step (confirmed v0.4.0). Set the body
        # explicitly after publishing so the behaviour is independent of
        # GoReleaser internals.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --notes-file .release-notes.md
          BODY=$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)
          if [ -z "$BODY" ]; then
            echo "ERROR: release body for ${GITHUB_REF_NAME} is still empty after set" >&2
            exit 1
          fi

      # Verify the release is actually installable, without making that check
      # part of this run's success.
      #
      # A release: published trigger would be the obvious mechanism and does
      # not work: GitHub does not start workflows from events raised with
      # GITHUB_TOKEN, and GoReleaser publishes with it, so the trigger that
      # used to sit in nightly-live never fired once from v0.17.0 to v0.23.0.
      # Every release so far has been smoke-tested only by the next day's
      # schedule, or by someone remembering to dispatch it by hand.
      #
      # Dispatch rather than a job here on purpose. A smoke failure marking
      # this run as "Release: failure" would mislabel the very run people check
      # to see whether the release shipped -- it did ship; it may just not be
      # servable yet. The dispatched run carries that signal separately, and
      # the smoke test already retries for several minutes to absorb Registry
      # ingestion lag.
      #
      # continue-on-error for the same reason: the release has already been
      # published by this point, so a failed dispatch must not turn a shipped
      # release red either. It still says so loudly rather than passing in
      # silence, which is how the dead trigger survived six releases.
      - name: Dispatch the Registry smoke test
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh workflow run registry-smoke-test.yml --ref main; then
            echo "::notice::Registry smoke test dispatched; it runs separately from this release."
          else
            echo "::warning::Could not dispatch the Registry smoke test. The release itself \
            published fine. Run it by hand: gh workflow run registry-smoke-test.yml --ref main"
          fi
