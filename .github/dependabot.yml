version: 2
updates:
  # These updates deliberately move direct dependencies only, which is the
  # gomod default. Indirect versions are chosen by minimal version selection --
  # the maximum of the minimums every module in the graph asks for -- so an
  # indirect dependency behind its latest release is the version this build's
  # dependencies collectively agreed on, not drift. Raising one unilaterally
  # puts the build in a combination nobody upstream tested, and the parent
  # library is better placed to judge that than a weekly bot.
  #
  # Indirect coverage comes from the two mechanisms that answer the question
  # currency cannot: Dependabot security updates, which reach the indirect
  # graph when an advisory lands, and the Vulncheck CI job, which reports
  # whether a vulnerable symbol is actually called. Neither is a cadence.
  # Override an indirect version by hand for a named reason -- an advisory, or
  # a bug actually hit -- not on a schedule.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      tools-dependencies:
        patterns:
          - "*"

  # The third Go module, covered by nothing until 2026-08-09. It pins
  # tfplugindocs for doc generation and ships nothing to users, so its exposure
  # is low -- but low should be a conclusion someone reached, not the accident
  # of a missing block.
  - package-ecosystem: gomod
    directory: /tools/serve
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      tools-serve-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  # requirements-dev.txt pins the datahub CLI, which boots and tears down every
  # Quickstart the live suites run against. It had no ecosystem block at all, so
  # it received neither version updates nor security alerts and drifted a minor
  # line behind the server it drives without anything noticing.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      python-dev-dependencies:
        patterns:
          - "*"
